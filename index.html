<style>
/* ============================================================
   AIN — REPRO 레퍼런스 재현 (Phase 1)
   흰 배경 · 검정/짙은회색 · 넓은 여백 · 세리프 헤드라인 · 모노톤
   ============================================================ */

:root{
  --bg:#ffffff;
  --paper:#f4f3f0;      /* 따뜻한 오프화이트 (교차 섹션) */
  --ink:#161616;        /* 거의 검정 */
  --ink-2:#3d3d3d;      /* 본문 */
  --sub:#6f6d69;        /* 보조 텍스트 / 라벨 */
  --line:#e5e2dd;       /* 헤어라인 */
  --dark:#141311;       /* 다크 섹션 */
  --dark-sub:#a7a29a;
  --gap:clamp(24px,6vw,80px);      /* 좌우 여백 */
  --sec:clamp(88px,12vw,176px);    /* 섹션 상하 여백 */
  --serif:"Noto Serif KR",serif;
  --sans:"Noto Sans KR",-apple-system,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--bg);
  font-weight:300;
  line-height:1.75;
  letter-spacing:.01em;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  word-break:keep-all;      /* 한글 단어 중간 줄바꿈 방지 */
  overflow-wrap:break-word;
}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none}

.wrap{max-width:1240px;margin:0 auto;padding-left:var(--gap);padding-right:var(--gap)}
.skip-link{position:fixed;top:12px;left:var(--gap);z-index:1000;padding:.65em 1em;
  background:var(--dark);color:#fff;transform:translateY(-160%);transition:transform .2s}
.skip-link:focus{transform:none}

/* 공통 타이포 ------------------------------------------------ */
.eyebrow{
  font-size:.72rem;font-weight:400;letter-spacing:.32em;
  text-transform:uppercase;color:var(--sub);
}
.h2{
  font-family:var(--serif);font-weight:400;color:var(--ink);
  font-size:clamp(1.85rem,4vw,3.1rem);line-height:1.32;
  letter-spacing:-.01em;
}
.h3{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(1.3rem,2.4vw,1.9rem);line-height:1.4;
}
.lead{
  font-size:clamp(1.06rem,1.7vw,1.35rem);
  color:var(--ink);font-weight:400;line-height:1.7;
}
.body{color:var(--ink-2);font-size:1.02rem;line-height:1.95}
.body + .body{margin-top:1.1em}

.link-arrow{
  display:inline-flex;align-items:center;gap:.7em;
  font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink);padding-bottom:.35em;
  border-bottom:1px solid var(--ink);
  transition:gap .4s var(--ease),opacity .3s;
}
.link-arrow::after{content:"→";font-size:1em}
.link-arrow:hover{gap:1.2em;opacity:.6}

/* 스크롤 등장 ------------------------------------------------ */
.reveal{opacity:0;transform:translateY(30px);
  transition:opacity 1s var(--ease),transform 1s var(--ease)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;transition:none}
  html{scroll-behavior:auto}
}

/* ============================================================
   헤더
   ============================================================ */
.site-header{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;
  height:80px;                 /* REPRO식 고정 높이(축소 기능 없음) */
  background:#fff;
  border-bottom:1px solid var(--line);
  color:var(--ink);
}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;width:100%}
.brand{display:flex;flex-direction:column;line-height:1.15;z-index:2}
.brand b{font-family:var(--serif);font-weight:500;font-size:1.12rem;letter-spacing:.04em}
.brand span{font-size:.6rem;letter-spacing:.28em;color:var(--sub);text-transform:uppercase;margin-top:.25em}

.nav{display:flex;align-items:center;gap:clamp(28px,3.4vw,52px)}
.nav a{font-size:.84rem;letter-spacing:.08em;font-weight:400;color:var(--ink-2);
  position:relative;padding:.3em 0;transition:color .3s}
.nav a:not(.nav__cta)::after{content:"";position:absolute;left:0;bottom:0;width:0;height:1px;
  background:currentColor;transition:width .4s var(--ease)}
.nav a:not(.nav__cta):hover{color:var(--ink)}
.nav a:not(.nav__cta):hover::after{width:100%}
.nav .tel{font-family:var(--serif);letter-spacing:.02em;font-size:.92rem;color:var(--ink)}
/* 문의하기 버튼 — REPRO 파란 버튼 구조 참고, 임시 짙은 청회색 */
.nav .nav__cta{background:#38424c;color:#fff;padding:.95em 1.7em;letter-spacing:.1em;
  font-size:.78rem;transition:background .3s}
.nav .nav__cta:hover{background:#242b32}
.nav .nav__cta::after{display:none}

.burger{display:none;width:30px;height:20px;position:relative;background:none;border:0;cursor:pointer;z-index:2}
.burger i{position:absolute;left:0;width:100%;height:1.5px;background:currentColor;transition:.4s var(--ease)}
.burger i:nth-child(1){top:2px}.burger i:nth-child(2){top:9px}.burger i:nth-child(3){top:16px}

/* ============================================================
   히어로
   ============================================================ */
.hero{position:relative;height:clamp(680px,74vh,780px);overflow:hidden;background:#dcdad6}
.hero__slides{position:absolute;inset:0}
.hero__slide{position:absolute;inset:0;opacity:0;
  transition:opacity 1.8s var(--ease);will-change:opacity}
.hero__slide.active{opacity:1}
.hero__slide img{width:100%;height:100%;object-fit:cover;
  animation:kb 9s ease-out both}
.hero__slide.active img{animation:kb 9s ease-out both}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
/* 좌측 흰색 페이드 — 어두운 제목 가독성 확보 */
.hero__scrim{position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(248,247,245,.95)0%,rgba(248,247,245,.74)22%,rgba(248,247,245,.18)48%,rgba(248,247,245,0)66%)}

.hero__inner{position:absolute;top:0;left:0;right:0;bottom:0;z-index:2;
  max-width:1240px;margin:0 auto;
  display:flex;flex-direction:column;justify-content:center;align-items:flex-start;
  text-align:left;color:var(--ink);padding:6vh var(--gap) 0}
.hero__title{font-family:var(--serif);font-weight:400;color:var(--ink);
  font-size:clamp(1.9rem,4vw,3.05rem);line-height:1.5;letter-spacing:.01em}
.hero__en{font-size:.76rem;letter-spacing:.32em;text-transform:uppercase;
  color:var(--sub);margin-top:1.7em}
.hero__sub{margin-top:1.1em;font-size:clamp(.9rem,1.4vw,1.02rem);
  font-weight:300;color:var(--ink-2);letter-spacing:.02em}

.hero__dots{position:absolute;left:0;right:0;bottom:30px;z-index:3;
  display:flex;gap:12px;justify-content:center}
.hero__dots button{width:26px;height:2px;background:rgba(40,38,35,.26);border:0;cursor:pointer;padding:0;transition:background .4s}
.hero__dots button.active{background:var(--ink)}

/* ============================================================
   ABOUT
   ============================================================ */
.about{padding:var(--sec) 0}
.about__grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.6fr);gap:clamp(40px,7vw,96px);align-items:center}
.about__head .eyebrow{display:block;margin-bottom:1.8em}
.about__head .body{margin-top:2em;max-width:30em}
.about__more{margin-top:2.6em}
.about__media{position:relative}
.about__media img{width:100%;aspect-ratio:3/4;object-fit:cover}
.about__media figcaption{margin-top:1em;font-size:.78rem;letter-spacing:.04em;color:var(--sub)}

/* ============================================================
   SERVICE
   ============================================================ */
.service{padding:var(--sec) 0;background:var(--paper)}
.sec-head{margin-bottom:clamp(48px,7vw,88px)}
.sec-head .eyebrow{display:block;margin-bottom:1.4em}
.sec-head--row{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;flex-wrap:wrap}
.sec-head--row .sec-head__desc{max-width:26em;color:var(--ink-2);font-size:.98rem;line-height:1.9}

.service__grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.svc{display:flex;flex-direction:column;padding:0 clamp(22px,2.4vw,40px)}
.svc + .svc{border-left:1px solid var(--line)}   /* 얇은 세로 구분선만 */
.svc:first-child{padding-left:0}
.svc:last-child{padding-right:0}
.svc__no{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--sub);margin-bottom:1.5em}
.svc__ttl{font-family:var(--serif);font-weight:500;font-size:1.18rem;line-height:1.45}
.svc__text{margin-top:1.05em;font-size:.9rem;line-height:1.9;color:var(--ink-2);flex:1}
.svc__go{display:inline-block;margin-top:1.9em;font-size:.74rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink);transition:opacity .3s}
.svc__go::after{content:" →"}
.svc:hover .svc__go{opacity:.5}

/* ============================================================
   FEATURE (강점)
   ============================================================ */
.feature{padding:var(--sec) 0}
.feature__grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(40px,6vw,96px);align-items:center}
.feature__media img{width:100%;aspect-ratio:3/4;object-fit:cover}
.feature__intro{margin:2em 0 2.6em;max-width:28em;color:var(--ink-2);line-height:1.95}
.feat-list{border-top:1px solid var(--line)}
.feat{display:grid;grid-template-columns:auto 1fr;gap:1.6em;
  padding:1.9em 0;border-bottom:1px solid var(--line)}
.feat__no{font-family:var(--serif);font-size:1.05rem;color:var(--sub);padding-top:.15em}
.feat__ttl{font-family:var(--serif);font-weight:500;font-size:1.14rem;margin-bottom:.5em}
.feat__text{font-size:.92rem;line-height:1.85;color:var(--ink-2)}

/* ============================================================
   WORKS
   ============================================================ */
.works{padding:var(--sec) 0;background:var(--paper)}
.works__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(20px,2.5vw,40px)}
.work{display:block}
.work__media{overflow:hidden;background:#e9e6e1}
.work__media img{width:100%;aspect-ratio:4/3;object-fit:cover;transition:transform 1.1s var(--ease)}
.work:hover .work__media img{transform:scale(1.05)}
.work__meta{margin-top:1.3em;display:flex;gap:1em;font-size:.72rem;letter-spacing:.12em;color:var(--sub);text-transform:uppercase}
.work__ttl{margin-top:.7em;font-family:var(--serif);font-weight:400;font-size:1.12rem;line-height:1.45}
.works__more{margin-top:clamp(44px,6vw,72px);text-align:center}

/* ============================================================
   CONTACT
   ============================================================ */
.contact{padding:var(--sec) 0;background:var(--dark);color:#fff;text-align:center}
.contact .eyebrow{color:var(--dark-sub)}
.contact__ttl{font-family:var(--serif);font-weight:300;color:#fff;
  font-size:clamp(1.9rem,4.4vw,3.2rem);line-height:1.4;margin:1.4em 0 1.1em}
.contact__desc{color:rgba(255,255,255,.72);font-weight:300;max-width:34em;margin:0 auto 2.8em}
.contact__tel{font-family:var(--serif);font-weight:300;font-size:clamp(2rem,5vw,3.4rem);
  letter-spacing:.02em;display:inline-block;color:#fff;transition:opacity .3s}
.contact__tel:hover{opacity:.7}
.contact__hours{margin-top:1em;font-size:.82rem;letter-spacing:.1em;color:var(--dark-sub)}
.contact__actions{margin-top:3em;display:flex;gap:2.4em;justify-content:center;flex-wrap:wrap}
.contact__actions a{font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;
  color:#fff;border-bottom:1px solid rgba(255,255,255,.5);padding-bottom:.4em;transition:border-color .3s}
.contact__actions a:hover{border-color:#fff}

/* ============================================================
   FOOTER
   ============================================================ */
.footer{background:#0e0d0c;color:#8f8b84;padding:clamp(64px,8vw,110px) 0 44px}
.footer__grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:40px}
.footer__brand b{font-family:var(--serif);font-weight:500;font-size:1.15rem;color:#f3f1ec;letter-spacing:.04em;display:block}
.footer__brand span{font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;display:block;margin:.7em 0 1.8em}
.footer__brand p{font-size:.86rem;line-height:1.8}
.footer__brand .tel{font-family:var(--serif);color:#e7e4de;font-size:1.05rem;margin-bottom:.4em}
.footer__col h4{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:#cbc7c0;margin-bottom:1.5em;font-weight:400}
.footer__col li{margin-bottom:.9em}
.footer__col a{font-size:.86rem;transition:color .3s}
.footer__col a:hover{color:#f3f1ec}
.footer__bottom{max-width:1240px;margin:clamp(48px,6vw,80px) auto 0;padding:28px var(--gap) 0;
  border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
  font-size:.72rem;letter-spacing:.06em}

/* ============================================================
   반응형
   ============================================================ */
@media (max-width:1024px){
  .nav{gap:clamp(22px,2.5vw,28px)}
  .brand,.nav a{flex-shrink:0}
  .nav .tel{white-space:nowrap}
  .service__grid{grid-template-columns:repeat(2,1fr);gap:36px 26px}
  .works__grid{grid-template-columns:repeat(2,1fr)}
  .footer__grid{grid-template-columns:1fr 1fr}
  .footer__brand{grid-column:1/-1;margin-bottom:16px}
}
@media (max-width:960px){
  .nav{position:fixed;inset:0;background:rgba(20,19,17,.97);backdrop-filter:blur(6px);
    flex-direction:column;justify-content:center;gap:1.6em;transform:translateX(100%);
    transition:transform .5s var(--ease);color:#fff}
  .nav.open{transform:none}
  .nav a{font-size:1.05rem;color:#fff}
  .nav .tel{font-size:1.2rem;color:#fff}
  .nav .nav__cta{background:transparent;padding:0;color:#fff}
  .burger{display:block}
  body.menu-open{overflow:hidden}

  /* 히어로: 화면의 약 70vh 배너 */
  .hero{height:70vh;min-height:460px;max-height:640px}
  .hero__inner{padding-top:4vh}

  .about__grid{grid-template-columns:1fr;gap:40px}
  .about__media{order:-1}
  .about__media img{aspect-ratio:4/3}
  .feature__grid{grid-template-columns:1fr;gap:44px}
  .feature__media img{aspect-ratio:4/3}
  .feature__media{order:-1}
  .works__grid{grid-template-columns:1fr}
  /* Service: 세로 구분선 → 가로 구분선 스택 */
  .service__grid{grid-template-columns:1fr;gap:0}
  .svc{padding:34px 0}
  .svc:first-child{padding-top:0}
  .svc + .svc{border-left:0;border-top:1px solid var(--line)}
  .contact__actions{gap:1.6em}
}
</style>
</head>

<!-- ▼ 콘텐츠 데이터 (이 파일만 수정하면 글·사진·정보가 바뀝니다) -->
<script src="data/site-content.js"></script>
<script>
(function(){
  "use strict";

  var S=window.SITE||{};
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(ch){
    return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[ch];});}
  function setText(id,v){var el=$(id);if(el)el.textContent=(v==null?"":v);}
  function setHTML(id,v){var el=$(id);if(el)el.innerHTML=(v==null?"":v);}
  function setAttr(id,a,v){var el=$(id);if(el)el.setAttribute(a,(v==null?"":v));}

  /* ── 콘텐츠 렌더링: data/site-content.js → 화면 ──────────── */
  function render(){
    if(!window.SITE)return;              // 데이터 파일이 없으면 조용히 종료
    var c=S.company||{};

    /* 헤더 */
    setText("brandName",c.shortName);
    setText("brandEn",c.enName);
    setText("navTel",c.tel); setAttr("navTel","href",c.telHref);

    /* 히어로 */
    var h=S.hero||{};
    setHTML("heroTitle",h.title); setText("heroEn",h.en); setText("heroSub",h.sub);
    var slides=$("slides"),dots=$("dots");
    if(slides&&h.images){
      slides.innerHTML=h.images.map(function(im,i){
        return '<div class="hero__slide'+(i===0?" active":"")+'"><img src="'+esc(im.src)+
          '" alt="'+esc(im.alt)+'"'+(i===0?' fetchpriority="high"':' loading="lazy"')+' /></div>';
      }).join("");
    }
    if(dots&&h.images){
      dots.innerHTML=h.images.map(function(im,i){
        return '<button'+(i===0?' class="active"':"")+' data-i="'+i+'"></button>';
      }).join("");
    }

    /* 회사소개 */
    var a=S.about||{};
    setText("aboutEyebrow",a.eyebrow); setHTML("aboutHeading",a.heading);
    var ab=$("aboutBody");
    if(ab&&a.paragraphs)ab.innerHTML=a.paragraphs.map(function(p){
      return '<p class="body">'+esc(p)+"</p>";}).join("");
    setText("aboutMore",a.moreText); setAttr("aboutMore","href",a.moreLink);
    setAttr("aboutImg","src",a.image); setAttr("aboutImg","alt",a.imageAlt);
    setText("aboutCaption",a.caption);

    /* 서비스 */
    var ss=S.serviceSection||{};
    setText("svcEyebrow",ss.eyebrow); setText("svcHeading",ss.heading); setText("svcDesc",ss.desc);
    var sg=$("serviceGrid");
    if(sg&&S.services)sg.innerHTML=S.services.map(function(s){
      return '<a class="svc reveal" href="'+esc(s.link)+'">'+
        '<p class="svc__no">'+esc(s.no)+'</p>'+
        '<h3 class="svc__ttl">'+esc(s.title)+'</h3>'+
        '<p class="svc__text">'+esc(s.text)+'</p>'+
        '<span class="svc__go">View More</span></a>';
    }).join("");

    /* 강점 */
    var fs=S.featureSection||{};
    setAttr("featureImg","src",fs.image); setAttr("featureImg","alt",fs.imageAlt);
    setText("featEyebrow",fs.eyebrow); setText("featHeading",fs.heading); setText("featIntro",fs.intro);
    var fl=$("featList");
    if(fl&&S.features)fl.innerHTML=S.features.map(function(f){
      return '<div class="feat"><span class="feat__no">'+esc(f.no)+'</span>'+
        '<div><h3 class="feat__ttl">'+esc(f.title)+'</h3>'+
        '<p class="feat__text">'+esc(f.text)+'</p></div></div>';
    }).join("");

    /* 시공사례 */
    var ws=S.worksSection||{};
    setText("worksEyebrow",ws.eyebrow); setText("worksHeading",ws.heading); setText("worksDesc",ws.desc);
    setText("worksMore",ws.moreText); setAttr("worksMore","href",ws.moreLink);
    var wg=$("worksGrid");
    if(wg&&S.works){
      var lim=ws.homeLimit||S.works.length;
      wg.innerHTML=S.works.slice(0,lim).map(function(w){
        var meta="";
        if(w.location)meta+="<span>"+esc(w.location)+"</span>";
        if(w.type)meta+="<span>"+esc(w.type)+"</span>";
        return '<a class="work reveal" href="'+esc(w.link||"#")+'">'+
          '<div class="work__media"><img src="'+esc(w.image)+'" alt="'+esc(w.imageAlt||w.title)+'" loading="lazy" /></div>'+
          '<div class="work__meta">'+meta+"</div>"+
          '<h3 class="work__ttl">'+esc(w.title)+'</h3></a>';
      }).join("");
    }

    /* 상담 */
    var ct=S.contact||{};
    setText("contactEyebrow",ct.eyebrow); setHTML("contactTitle",ct.heading); setHTML("contactDesc",ct.desc);
    setText("contactTel",c.tel); setAttr("contactTel","href",c.telHref);
    setText("contactHours",ct.hours);
    var ca=$("contactActions");
    if(ca)ca.innerHTML='<a href="'+esc(c.telHref)+'">전화 상담</a>'+
      '<a href="mailto:'+esc(c.email)+'">사진 상담</a>'+
      '<a href="contact.html">견적 문의</a>';

    /* 푸터 */
    setText("footName",c.name); setText("footEn",c.enName);
    setText("footTel",c.tel); setText("footAddr",c.address); setText("footEmail",c.email);
    setText("footCopyName",c.name); setText("footTagline",c.tagline);
    var f=S.footer||{};
    function linkList(id,arr){var el=$(id);if(!el||!arr)return;
      el.innerHTML=arr.map(function(l){
        var ext=l.external?' target="_blank" rel="noopener noreferrer"':"";
        return '<li><a href="'+esc(l.href)+'"'+ext+">"+esc(l.label)+"</a></li>";
      }).join("");}
    linkList("footServiceLinks",f.serviceLinks);
    linkList("footSiteLinks",f.siteLinks);
    var ch=[];
    if(c.shop)ch.push({label:"온라인몰",href:c.shop,external:true});
    if(c.blog)ch.push({label:"네이버 블로그",href:c.blog,external:true});
    if(c.youtube)ch.push({label:"유튜브",href:c.youtube,external:true});
    if(c.instagram)ch.push({label:"인스타그램",href:c.instagram,external:true});
    linkList("footChannelLinks",ch);
  }
  render();

  /* 모바일 메뉴 -------------------------------------------- */
  var burger=document.getElementById("burger");
  var nav=document.getElementById("nav");
  var mobileMenu=window.matchMedia("(max-width: 960px)");
  function closeMenu(returnFocus){
    nav.classList.remove("open");
    burger.setAttribute("aria-expanded","false");
    burger.setAttribute("aria-label","메뉴 열기");
    document.body.classList.remove("menu-open");
    nav.inert=mobileMenu.matches;
    if(returnFocus&&mobileMenu.matches)burger.focus();
  }
  function syncMenu(){
    closeMenu(false);
    nav.inert=mobileMenu.matches;
  }
  burger.addEventListener("click",function(){
    var open=!nav.classList.contains("open");
    if(!open){closeMenu(true);return;}
    nav.inert=false;
    nav.classList.add("open");
    burger.setAttribute("aria-expanded","true");
    burger.setAttribute("aria-label","메뉴 닫기");
    document.body.classList.add("menu-open");
  });
  nav.querySelectorAll("a").forEach(function(a){
    a.addEventListener("click",function(){
      if(mobileMenu.matches)closeMenu(true);
    });
  });
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&nav.classList.contains("open"))closeMenu(true);
  });
  if(mobileMenu.addEventListener)mobileMenu.addEventListener("change",syncMenu);
  else mobileMenu.addListener(syncMenu);
  syncMenu();

  /* 스크롤 등장 (IntersectionObserver) --------------------- */
  var reveals=document.querySelectorAll(".reveal");
  if("IntersectionObserver" in window){
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}
      });
    },{threshold:0.12,rootMargin:"0px 0px -8% 0px"});
    reveals.forEach(function(el,i){
      el.style.transitionDelay=(i%4)*80+"ms";
      io.observe(el);
    });
  }else{
    reveals.forEach(function(el){el.classList.add("in");});
  }

  /* 히어로 슬라이더 ---------------------------------------- */
  var slides=Array.prototype.slice.call(document.querySelectorAll(".hero__slide"));
  var dots=Array.prototype.slice.call(document.querySelectorAll(".hero__dots button"));
  var cur=0,timer;
  function go(n){
    slides[cur].classList.remove("active");
    if(dots[cur])dots[cur].classList.remove("active");
    cur=(n+slides.length)%slides.length;
    slides[cur].classList.add("active");
    if(dots[cur])dots[cur].classList.add("active");
  }
  function start(){timer=setInterval(function(){go(cur+1);},6000);}
  function reset(){clearInterval(timer);start();}
  dots.forEach(function(d){
    d.addEventListener("click",function(){go(+d.dataset.i);reset();});
  });
  if(slides.length>1)start();

  /* 연도 -------------------------------------------------- */
  document.getElementById("year").textContent=new Date().getFullYear();
})();
</script>
</body>
</html>
